name: Build IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project BetterYTMusic.xcodeproj \
            -scheme BetterYTMusic \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            build

      - name: Package .ipa
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/BetterYTMusic.app Payload/
          zip -qry BetterYTMusic.ipa Payload

      # Nome = data/hora de Brasília (ex.: 2026.11.02-1015). Ao contrário de "Build 9/10/11",
      # fica em ordem mesmo quando a lista é ordenada como texto.
      - name: Version name
        id: version
        run: echo "name=$(TZ=America/Sao_Paulo date +%Y.%m.%d-%H%M)" >> "$GITHUB_OUTPUT"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.name }}
          name: ${{ steps.version.outputs.name }}
          files: BetterYTMusic.ipa
          make_latest: true
