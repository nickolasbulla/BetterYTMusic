name: BetterYTMusic
options:
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  # Extrai os links de áudio do YouTube. Segue a branch main para cada build
  # pegar as correções mais recentes quando o YouTube muda algo.
  YouTubeKit:
    url: https://github.com/alexeichhorn/YouTubeKit
    branch: main
targets:
  BetterYTMusic:
    type: application
    platform: iOS
    sources:
      - path: App
    dependencies:
      - package: YouTubeKit
    settings:
      base:
        # Fixo: novas versões substituem a anterior no SideStore.
        PRODUCT_BUNDLE_IDENTIFIER: com.marcao.betterytmusic
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: BetterYTM
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIBackgroundModes: [audio]
        # Mostra Documents do app em Arquivos → No Meu iPhone → BetterYTM
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
    scheme: {}
