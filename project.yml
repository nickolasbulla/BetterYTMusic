name: BetterYTMusic
options:
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    # Versão do app (semver) e nome do release no GitHub (v0.5.0).
    # Correção: 0.5.0 → 0.5.1. Função nova: 0.5.1 → 0.6.0.
    # Sem mudar aqui, um novo build substitui o .ipa do release atual.
    MARKETING_VERSION: "0.6.9"
    CURRENT_PROJECT_VERSION: "1"
packages:
  # Extrai os links de áudio do YouTube. Segue a branch main para cada build
  # pegar as correções mais recentes quando o YouTube muda algo.
  YouTubeKit:
    url: https://github.com/alexeichhorn/YouTubeKit
    branch: main
targets:
  BetterYTMusic:
    type: application
    platform: iOS
    sources:
      - path: App
    dependencies:
      - package: YouTubeKit
    settings:
      base:
        # Fixo: novas versões substituem a anterior no SideStore.
        PRODUCT_BUNDLE_IDENTIFIER: com.marcao.betterytmusic
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: BetterYTM
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIBackgroundModes: [audio]
        # Mostra Documents do app em Arquivos → No Meu iPhone → BetterYTM
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
    scheme: {}
